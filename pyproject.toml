[project]
name = "delhi-spatial-index"
version = "0.3.0"
description = "Delhi Public Services Index (PSI) pipeline"
authors = [
    { name = "Bob Bell", email = "bwbelljr@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "geopandas>=1.1",
    "pandas>=2.3",
    "shapely>=2.1",
    "matplotlib>=3.10",
    "pyproj>=3.7",
    "tqdm>=4.67",
    "joblib>=1.5",
    "pyyaml>=6.0",
]

[project.scripts]
delhi-psi = "delhi_psi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Required: the project name (delhi-spatial-index) is not the package name.
# This also ships delhi_psi/profiles/*.yaml inside the wheel.
packages = ["delhi_psi"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.ruff]
target-version = "py313"
exclude = ["archive"]

[tool.ruff.lint]
# The maintained code is already clean under pyflakes + syntax; the historical
# notebooks under archive/ are excluded. Broader rule sets are a separate
# decision (DEL-70), not a blocker.
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures are imported at module level and then requested as function
# arguments; pyflakes reads that idiom as a redefinition.
"tests/test_measure_roads_access.py" = ["F811"]
