[project]
name = "delhi-spatial-index"
version = "0.2.0"
description = "Delhi Public Services Index (PSI) pipeline"
authors = [
    { name = "Bob Bell", email = "bwbelljr@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "geopandas>=1.1",
    "pandas>=2.3,<3",
    "shapely>=2.1",
    "matplotlib>=3.10",
    "pyproj>=3.7",
    "tqdm>=4.67",
    "joblib>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
]
