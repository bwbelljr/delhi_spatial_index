profile: manuscript
categories:
  scheme: uso-10
  mapping:                          # identity, as code-2025 (spec 3B 2)
    Planned: Planned
    UAC: UAC
    JJC: JJC
    RUAC: RUAC
    RV: RV
    UV: UV
    SDA: SDA
    JJR: JJR
    Industrial: Industrial
    Other: Other
methodology:
  adjacency:
    rule: touch                     # bbox | touch | within_distance
                                    # max_distance_km: required iff rule is
                                    # within_distance (>= 0 km, polygon-to-polygon)
  barrier: {rule: pairwise, combine: any}
  overlap: {lending: whole}         # whole | outside_receiver (DEL-20); the
                                    # manuscript is silent, so today's rule
  decay:
    form: inverse_linear            # inverse_linear | none | inverse_power | exponential
                                    # exponent: required iff form is inverse_power (> 0)
                                    # scale_km:  required iff form is exponential (> 0)
    distance: centroid              # centroid | boundary — the manuscript's d_ij,
                                    # centroid-to-centroid as always
    distance_unit: km               # manuscript is silent on the unit (spec 8)
  transform:
    form: none                      # none | log1p | cbrt (DEL-34); no stage key
                                    # when form is none
  aggregation:
    rule: mean_minmax               # mean_minmax | mean_rank (DEL-57)
                                    # mean_minmax is today: Eq. 2 min-maxes
                                    # each service's PCEN, then Eq. 1
                                    # averages. mean_rank replaces the
                                    # min-max with a percentile rank —
                                    # uniform by construction, so no mass
                                    # point at zero can form. Not adopted.
  roads: eq4_own_only
  second_normalization: false                        # no norm_psi column
  exclusion: {types: [], stage: post_neighbors, absent_neighbor: contributes}
outputs: {denominators: [pop], formats: [csv], name_template: "delhi_psi_{profile}_{denominator}_2020"}
