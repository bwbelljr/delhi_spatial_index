profile: services-contested
# DEL-42: the contested-services panel — code-2025 restricted to `bank`,
# `police`, `ration`, `transport` (point) and `road` (line), the exact
# complement of services-uncontested. Together the two partition
# code-2025's seven services (spec § 2): every service in exactly one
# panel, none in both, none in neither.
#
# `transport`'s placement here is genuinely ambiguous — Fable's 7 Sep ruling
# put it in this panel rather than hiding the ambiguity (spec § 1). See
# docs/superpowers/specs/2026-09-07-del-42-uncontested-contested-design.md.
#
# Every block this file omits — layers, crs, validate, paths, outputs —
# takes the code-2025 default from the loader, and every methodology/
# categories key is restated verbatim (spec 3B § 2's "never inherited"
# rule, and the tests/test_sweep_profiles.py one-factor guard checks it).
#
# Ships the fixture and guard only: the reportable numbers wait on the
# ratified profile (DEL-31).
services:
  point: {bank: Public Services/Banking/Banking.shp,
          police: Public Services/Police/Police Station.shp,
          ration: Public Services/Ration/Ration.shp,
          transport: Public Services/Transport/Transport.shp}
                                    # THE CHANGE: health, school omitted
  line:  {road: Public Services/Major Road/Road.shp}
categories:
  scheme: uso-10
  mapping:
    Planned: Planned
    UAC: UAC
    JJC: JJC
    RUAC: RUAC
    RV: RV
    UV: UV
    SDA: SDA
    JJR: JJR
    Industrial: Industrial
    Other: Other
methodology:
  adjacency:
    rule: bbox
  barrier:
    rule: global_asymmetric
    combine: any
  overlap:
    lending: whole
  decay:
    form: inverse_linear
    distance: centroid
    distance_unit: km
  transform:
    form: none                      # none | log1p | cbrt (DEL-34); no stage key
                                    # when form is none
  roads: decayed
  second_normalization: true
  exclusion:
    types: [RV]
    stage: post_neighbors
    absent_neighbor: swallowed
