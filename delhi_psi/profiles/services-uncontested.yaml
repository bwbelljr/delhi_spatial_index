profile: services-uncontested
# DEL-42: the uncontested-services panel — code-2025 restricted to `health`
# and `school`, the two services no reviewer has argued are private,
# targeted, or coercive. The ticket originally asked for "schools, health,
# water only"; there is no settlement-level water-provision layer and never
# was, so per Fable's 7 Sep ruling this ships as a two-service test instead
# (spec § 1). That ruling ALSO said: do not add road length to make up a
# third item. Roads are a line measure on a different scale, and roads are
# the service where the formal/informal gap is most mechanically guaranteed
# — planned colonies have planned road grids by definition — so including
# them would hand a critic exactly the objection this panel exists to
# remove.
#
# `services.line` is deliberately EMPTY: this is the first shipped profile
# with no line service at all (spec § 3). Paired with services-contested,
# the two partition code-2025's seven services exactly (spec § 2) — if the
# formal/informal gap survives in BOTH halves, it is a property of
# settlement location rather than of any one service class. See
# docs/superpowers/specs/2026-09-07-del-42-uncontested-contested-design.md.
#
# Every block this file omits — layers, crs, validate, paths, outputs —
# takes the code-2025 default from the loader, and every methodology/
# categories key is restated verbatim (spec 3B § 2's "never inherited"
# rule, and the tests/test_sweep_profiles.py one-factor guard checks it).
#
# Ships the fixture and guard only: the reportable numbers wait on the
# ratified profile (DEL-31), and the write-up caveat about water (spec § 5)
# belongs in the methods text, not here.
services:
  point: {health: Public Services/Health/Health.shp,
          school: Public Services/School/schools7760.shp}
  line:  {}
categories:
  scheme: uso-10
  mapping:
    Planned: Planned
    UAC: UAC
    JJC: JJC
    RUAC: RUAC
    RV: RV
    UV: UV
    SDA: SDA
    JJR: JJR
    Industrial: Industrial
    Other: Other
methodology:
  adjacency:
    rule: bbox
  barrier:
    rule: global_asymmetric
    combine: any
  overlap:
    lending: whole
  decay:
    form: inverse_linear
    distance: centroid
    distance_unit: km
  transform:
    form: none                      # none | log1p | cbrt (DEL-34); no stage key
                                    # when form is none
  aggregation:
    rule: mean_minmax               # mean_minmax | mean_rank (DEL-57)
                                    # mean_minmax is today: Eq. 2 min-maxes
                                    # each service's PCEN, then Eq. 1
                                    # averages. mean_rank replaces the
                                    # min-max with a percentile rank —
                                    # uniform by construction, so no mass
                                    # point at zero can form. Not adopted.
  roads: decayed
  second_normalization: true
  exclusion:
    types: [RV]
    stage: post_neighbors
    absent_neighbor: swallowed
